<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#f8fafc">
  <title>🐍 Demo: Arcade Snake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Fira+Sans:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Arcade Snake Multi-Player</h1>
    <p>Escaneie o QR Code no Totem com seu celular. D-PAD Move.</p>
  </header>

  <main>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="sidePanel">
      <h2>Scoreboard</h2>
      <ul id="scoreList"></ul>

      <h2 class="debug-heading">Debug Log</h2>
      <div id="connStatus" class="conn-status conn-status--connecting">🟡 Conectando SSE...</div>
      <div id="debugLog"></div>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
