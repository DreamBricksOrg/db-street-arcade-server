<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Street Arcade</title>
  <meta name="description" content="Controle do Street Arcade. Escaneie o QR Code para jogar." />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="/assets/brand/dreambricks-mark-blue.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Brand tokens come from /css/tokens.css (DreamBricks Design System).
         Gamepad button colours — Xbox ABXY palette, quarantined to #gamepad
         face buttons only (see DESIGN.md "Xbox Quarantine Rule"). Untouched
         by the DreamBricks migration: this is the product's signature
         moment and PRODUCT.md treats it as essential, not decoration. */
      --btn-A: #107c10;
      --btn-B: #e23c28;
      --btn-X: #0078d4;
      --btn-Y: #ffb900;
      --dpad:  oklch(0.89 0.014 230);
    }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* touch-action:none is scoped to the gamepad itself, not the whole page,
       so pinch-zoom (WCAG 1.4.4) still works everywhere else on this screen. */
    #gamepad {
      touch-action: none;
    }

    /* ── Utility screens (shared .sa-screen in components.css) ──────────── */
    #loading, #error-screen { z-index: 10; }

    /* ── Play screen ─────────────────────────────────────────────────────── */
    #play-screen {
      position: fixed; inset: 0;
      display: none;
      flex-direction: column;
    }

    /* Status bar */
    .play-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .play-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 15px; font-weight: 700;
      color: var(--surface-brand-strong);
    }
    .play-title img { width: 28px; height: auto; }

    .dpad-btn svg { width: 45%; height: 45%; color: var(--text-secondary); }
    .dpad-btn.pressed svg { color: var(--surface-brand-strong); }

    #sid-label { font-size: 11px; font-family: var(--font-mono); color: var(--text-secondary); }

    /* ── Gamepad area ────────────────────────────────────────────────────── */
    #gamepad {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: clamp(24px, 8vw, 64px);
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      min-height: 0;        /* prevents flex overflow */
    }

    /* ── D-Pad ───────────────────────────────────────────────────────────── */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
      width: min(42vw, 180px);
      aspect-ratio: 1;
      flex-shrink: 0;
    }

    .dpad-btn {
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
      font: inherit;
      color: inherit;
      background: var(--dpad);
      border: 1px solid oklch(0.16 0.028 230 / 0.1);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(14px, 4vw, 22px);
      cursor: pointer;
      transition: background 0.08s, transform 0.08s;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    .dpad-btn.pressed {
      background: var(--surface2);
      transform: scale(0.9);
      border-color: var(--accent);
      box-shadow: var(--glow);
    }

    .dpad-btn:focus-visible,
    .face-btn:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    /* Hide center cell */
    .dpad-center {
      background: transparent;
      border: none;
      pointer-events: none;
    }

    /* ── Face buttons — Cruz estilo Xbox ───────────────────────────────────
       Grid 3×3; cantos vazios formam a cruz:
             [ ]  [Y]  [ ]
             [X]  [ ]  [B]
             [ ]  [A]  [ ]
    ─────────────────────────────────────────────────────────────────────── */
    .face-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      width: min(44vw, 186px);
      aspect-ratio: 1;
      flex-shrink: 0;
    }

    /* Empty corner cells */
    .face-empty {
      background: transparent;
      pointer-events: none;
    }

    .face-btn {
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
      font: inherit;
      border-radius: 50%;
      border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(15px, 4.5vw, 22px);
      font-weight: 700;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.08s, filter 0.08s;
      -webkit-tap-highlight-color: transparent;
      aspect-ratio: 1;
      position: relative;
      box-shadow: 0 5px 0 oklch(0.16 0.028 230 / 0.15);
      letter-spacing: 0;
    }

    .face-btn.pressed {
      transform: scale(0.87) translateY(3px);
      box-shadow: 0 2px 0 oklch(0.16 0.028 230 / 0.15);
      filter: brightness(1.35);
    }

    /* Xbox colour palette */
    #btn-A { background: #107c10; color: #fff; }   /* Xbox green  — bottom */
    #btn-B { background: #e23c28; color: #fff; }   /* Xbox red    — right  */
    #btn-X { background: #0078d4; color: #fff; }   /* Xbox blue   — left   */
    #btn-Y { background: #ffb900; color: var(--db-slate-900); }   /* Xbox yellow — top    */

    /* ── Input log (debug, hidden by default) ──────────────────────────── */
    #input-log {
      position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.8);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px 12px;
      font-size: 11px; font-family: var(--font-mono); color: var(--muted);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
      white-space: nowrap;
      z-index: 5;
    }

    #input-log.show { opacity: 1; }

    /* ── Safe area (notch support) ──────────────────────────────────────── */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      #gamepad {
        padding-bottom: calc(16px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <main id="loading" class="sa-screen" aria-live="polite">
    <div class="sa-mark"><img src="/assets/brand/dreambricks-mark-blue.svg" alt="DreamBricks" /></div>
    <div>
      <h1 class="sa-title sa-title--brand">Street Arcade</h1>
      <p class="sa-sub">Conectando ao seu controle…</p>
    </div>
    <div class="sa-loader" role="progressbar" aria-label="Carregando"></div>
  </main>

  <!-- Error / session-ended screen (session.js fills title, message, action) -->
  <main id="error-screen" class="sa-screen" style="display: none;" aria-live="assertive">
    <img class="sa-mascot" src="/assets/brand/jobson-wave.webp" alt="" width="320" height="322" />
    <div>
      <h1 class="sa-title" id="error-title">Não deu para conectar</h1>
      <p class="sa-sub" id="error-msg">Não foi possível conectar à sessão.</p>
    </div>
    <div class="sa-actions" id="error-actions"></div>
  </main>

  <!-- Play screen (G8.1 — D-Pad + ABXY + status) -->
  <div id="play-screen">

    <!-- Status header -->
    <div class="play-header">
      <span class="play-title"><img src="/assets/brand/dreambricks-mark-blue.svg" alt="" /> Street Arcade</span>
      <span id="conn" class="db-badge db-badge--dot" role="status">Conectando…</span>
      <span id="sid-label">—</span>
    </div>

    <!-- Gamepad (G8.1) -->
    <div id="gamepad">

      <!-- D-Pad (left side). Keyboard: arrow keys (global) or Tab+Space/Enter per button. -->
      <div class="dpad">
        <!-- Row 1 -->
        <div></div>
        <button type="button" id="btn-up" class="dpad-btn" data-btn aria-label="Cima (seta ↑)"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 6 21 18H3z"/></svg></button>
        <div></div>
        <!-- Row 2 -->
        <button type="button" id="btn-left"  class="dpad-btn" data-btn aria-label="Esquerda (seta ←)"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 12 18 3v18z"/></svg></button>
        <div class="dpad-center"></div>
        <button type="button" id="btn-right" class="dpad-btn" data-btn aria-label="Direita (seta →)"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 12 6 21V3z"/></svg></button>
        <!-- Row 3 -->
        <div></div>
        <button type="button" id="btn-down" class="dpad-btn" data-btn aria-label="Baixo (seta ↓)"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 18 3 6h18z"/></svg></button>
        <div></div>
      </div>

      <!-- Face buttons — Cruz Xbox: Y(topo) X(esq) B(dir) A(baixo). Keyboard: I/J/K/L (global) or Tab+Space/Enter. -->
      <div class="face-buttons">
        <!-- Row 1: _ Y _ -->
        <div class="face-empty"></div>
        <button type="button" id="btn-Y" class="face-btn" data-btn aria-label="Y (tecla I)">Y</button>
        <div class="face-empty"></div>
        <!-- Row 2: X _ B -->
        <button type="button" id="btn-X" class="face-btn" data-btn aria-label="X (tecla J)">X</button>
        <div class="face-empty"></div>
        <button type="button" id="btn-B" class="face-btn" data-btn aria-label="B (tecla L)">B</button>
        <!-- Row 3: _ A _ -->
        <div class="face-empty"></div>
        <button type="button" id="btn-A" class="face-btn" data-btn aria-label="A (tecla K)">A</button>
        <div class="face-empty"></div>
      </div>

    </div><!-- #gamepad -->

    <!-- Input debug log -->
    <div id="input-log"></div>
  </div>

  <!-- C9.2 + C9.3: session orchestrator (reads URL, connects WS, wires gamepad) -->
  <script type="module" src="/session.js"></script>
</body>
</html>
