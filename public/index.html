<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Street Arcade — Painel Operador</title>
  <meta name="description" content="Painel do operador para gerenciar sessões do Street Arcade, exibir QR Codes e configurar totens." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Fira+Sans:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #f8fafc;
      --surface:    #ffffff;
      --surface2:   #f1f5f9;
      --border:     #e2e8f0;
      --accent:     #3b82f6;
      --accent2:    #60a5fa;
      --cta:        #f97316;
      --text:       #0f172a;
      --text-muted: #64748b;
      --success:    #10b981;
      --danger:     #ef4444;
      --radius:     8px;
      --glow:       0 4px 14px rgba(59, 130, 246, 0.4);
    }

    html, body { height: 100%; }

    body {
      font-family: 'Fira Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-icon {
      height: 48px;
      display: flex; align-items: center; justify-content: center;
    }

    .logo-icon img {
      max-height: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      font-family: 'Fira Code', monospace;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .badge-live {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--success);
      font-weight: 600;
    }

    .dot-pulse {
      width: 8px; height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    /* ── Main layout ─────────────────────────────────────────────────────── */
    main {
      flex: 1;
      display: block;
      overflow-y: auto;
      background: var(--bg);
    }

    /* ── Tab Nav ──────────────────────────────────────────────────────────── */
    .tab-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      padding: 14px 8px;
      font-family: 'Fira Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .tab-btn:hover { color: var(--text); background: var(--surface2); }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(59, 130, 246, 0.04);
    }

    .tab-btn svg { flex-shrink: 0; }

    /* ── Tab Panels ──────────────────────────────────────────────────────── */
    .tab-panel {
      display: none;
      flex-direction: column;
      gap: 20px;
      padding: 24px;
      flex: 1;
      overflow-y: auto;
    }

    .tab-panel.active { display: flex; }

    .panel-title {
      font-size: 13px;
      font-weight: 700;
      font-family: 'Fira Code', monospace;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── Form fields ──────────────────────────────────────────────────────── */
    .field-group { display: flex; flex-direction: column; gap: 7px; }

    label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Fira Sans', sans-serif;
      font-size: 15px;
      padding: 11px 14px;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.18);
    }

    input::placeholder { color: var(--text-muted); opacity: 0.7; }

    /* ── Expiry row ───────────────────────────────────────────────────────── */
    .expiry-row {
      display: grid;
      grid-template-columns: 1fr 90px;
      gap: 8px;
    }

    #expiry-custom { display: none; }

    .expiry-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ── Buttons ──────────────────────────────────────────────────────────── */
    .btn {
      padding: 13px 18px;
      border: none;
      border-radius: 8px;
      font-family: 'Fira Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.2);
    }

    .btn-primary:hover { transform: translateY(-2px); box-shadow: var(--glow); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      font-size: 13px;
      padding: 9px 14px;
    }

    .btn-secondary:hover { background: var(--border); color: var(--text); }

    /* ── Divider ──────────────────────────────────────────────────────────── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 4px 0;
    }

    /* ── Totem list (sidebar) ─────────────────────────────────────────────── */
    #totem-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .totem-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s;
    }

    .totem-card:hover { border-color: var(--accent2); }

    .totem-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .totem-card-name {
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
    }

    .totem-card-addr {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      color: var(--success);
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 999px;
      padding: 2px 10px;
      white-space: nowrap;
    }

    .totem-card-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .totem-card-meta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .totem-session-status {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-height: 24px;
    }

    .session-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 2px 10px;
      border-radius: 999px;
    }

    .badge-loading  { background: rgba(100,116,139,0.1); color: var(--text-muted); border: 1px solid var(--border); }
    .badge-active   { background: rgba(16,185,129,0.12); color: var(--success); border: 1px solid rgba(16,185,129,0.3); }
    .badge-inactive { background: rgba(100,116,139,0.1); color: var(--text-muted); border: 1px solid var(--border); }

    .session-badge-info {
      font-size: 11px;
      color: var(--text-muted);
    }

    .btn-end-session {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid rgba(239,68,68,0.4);
      background: rgba(239,68,68,0.06);
      color: var(--danger);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-end-session:hover { background: rgba(239,68,68,0.15); border-color: var(--danger); }

    .btn-icon {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'Fira Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
      background: var(--surface);
      color: var(--text-muted);
    }

    .btn-icon:hover { background: var(--surface2); color: var(--text); }

    .btn-delete:hover { border-color: var(--danger); color: var(--danger); background: rgba(239,68,68,0.06); }
    .btn-edit:hover   { border-color: var(--accent);  color: var(--accent);  background: rgba(59,130,246,0.06); }
    .btn-qr:hover     { border-color: var(--accent);  color: var(--accent);  background: rgba(59,130,246,0.06); }


    #totem-empty {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 32px 0;
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
    }

    #totem-error {
      display: none;
      background: rgba(239,68,68,0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
    }

    /* ── Content area ────────────────────────────────────────────────────── */
    section.content {
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      overflow-y: auto;
    }

    /* ── QR Card ─────────────────────────────────────────────────────────── */
    #qr-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      max-width: 440px;
      margin: 0 auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1);
    }

    #qr-card.visible { display: flex; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .qr-label {
      font-size: 14px;
      font-weight: 700;
      font-family: 'Fira Code', monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
    }

    #qr-image {
      width: 260px; height: 260px;
      border-radius: 12px;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      padding: 12px;
    }

    #qr-image img { width: 100%; height: 100%; object-fit: contain; border-radius: 6px; }

    .qr-url {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      word-break: break-all;
      max-width: 300px;
    }

    .session-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .meta-pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .meta-pill span { color: var(--text); }

    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .status-waiting  { background: rgba(245,158,11,0.12); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
    .status-active   { background: rgba(16,185,129,0.12); color: var(--success); border: 1px solid rgba(16,185,129,0.3); }
    .status-finished { background: rgba(239,68,68,0.12); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }

    /* ── Session list ────────────────────────────────────────────────────── */
    .sessions-header { display: flex; align-items: center; justify-content: space-between; }
    .sessions-header h2 { font-size: 20px; font-weight: 700; font-family: 'Fira Code', monospace; }

    #session-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .session-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex; flex-direction: column; gap: 12px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
    }

    .session-card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .session-card-id { font-size: 13px; font-family: 'Fira Code', monospace; color: var(--text-muted); }
    .session-card-players { font-size: 14px; color: var(--text-muted); }
    .session-card-players strong { color: var(--text); }

    /* ── Empty state ─────────────────────────────────────────────────────── */
    #empty-state {
      display: flex; flex-direction: column; align-items: center;
      gap: 16px; padding: 80px 20px;
      color: var(--text-muted);
    }

    #empty-state .emoji { font-size: 64px; }
    #empty-state p { font-size: 16px; }

    /* ── Toast ───────────────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 14px; font-weight: 600;
      display: none;
      z-index: 999;
      animation: fadein 0.3s ease;
    }

    #toast.success { background: rgba(0,230,118,0.15); border: 1px solid var(--success); color: var(--success); }
    #toast.error   { background: rgba(255,82,82,0.15); border: 1px solid var(--danger);  color: var(--danger);  }

    @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }

    /* ── Spinner ─────────────────────────────────────────────────────────── */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block; vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Modal ───────────────────────────────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center; justify-content: center;
      animation: fadeInModal 0.2s;
    }

    .modal-overlay.active { display: flex; }

    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0;
      width: 90%; max-width: 480px;
      position: relative;
      box-shadow: 0 16px 64px rgba(0,0,0,0.4);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .modal-close {
      position: absolute; top: 14px; right: 16px;
      background: transparent; border: none; font-size: 22px; line-height: 1;
      color: var(--text-muted); cursor: pointer; transition: color 0.2s;
      z-index: 2;
    }

    .modal-close:hover { color: var(--text); }

    .modal-header {
      padding: 22px 28px 18px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      font-size: 16px;
      font-family: 'Fira Code', monospace;
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }

    .modal-header p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .modal-body {
      padding: 22px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-footer {
      padding: 14px 28px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      background: var(--surface2);
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    @keyframes fadeInModal { from { opacity: 0; } to { opacity: 1; } }

    /* ── Responsive ──────────────────────────────────────────────────────── */
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: none; border-bottom: 1px solid var(--border); }
      section.content { padding: 24px 16px; }
    }

    /* ── Queue Panel ─────────────────────────────────────────────────────── */
    .queue-panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      font-size: 12px;
    }

    .queue-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .queue-count {
      font-weight: 600;
      font-size: 11px;
      color: var(--accent);
    }

    .queue-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      transition: background 0.15s;
    }

    .queue-row:last-child { border-bottom: none; }
    .queue-row:hover { background: var(--surface2); }

    .queue-row--playing {
      background: rgba(16, 185, 129, 0.04);
    }

    .queue-pos {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 24px;
    }

    .queue-pid {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      color: var(--text);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .queue-status {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--success);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 999px;
      padding: 2px 8px;
    }

    .btn-kick {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      font-family: 'Fira Sans', sans-serif;
      padding: 3px 8px;
      border-radius: 5px;
      border: 1px solid rgba(239, 68, 68, 0.35);
      background: rgba(239, 68, 68, 0.06);
      color: var(--danger);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-kick:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: var(--danger);
    }

    .queue-divider {
      height: 1px;
      background: var(--border);
    }

    .queue-device-meta {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
      font-weight: 500;
    }

    /* ── Totem ID chip ───────────────────────────────────────────────────── */
    .totem-id-chip {
      font-family: 'Fira Code', monospace;
      font-size: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 7px;
      color: var(--text-muted);
      user-select: none;
      transition: color 0.2s, background 0.2s;
    }

    .totem-id-chip:hover {
      background: var(--border);
      color: var(--text);
    }

    /* ── Queue toggle active state ───────────────────────────────────────── */
    .btn-queue-toggle--active {
      border-color: var(--accent) !important;
      color: var(--accent) !important;
      background: rgba(59, 130, 246, 0.08) !important;
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="/">
      <div class="logo-icon">
        <img src="/assets/images/dreambricks_logo_250x160.png" alt="DreamBricks Logo">
      </div>
      <span class="logo-text">Street Arcade</span>
    </a>
    <div class="badge-live">
      <div class="dot-pulse"></div>
      OPERADOR
    </div>
  </header>

  <main>
    <!-- ── Content ─────────────────────────────────────────────────────── -->
    <section class="content">
      <div class="sessions-header" style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Sessões Ativas</h2>
        <button id="btn-new-totem" class="btn btn-primary" style="width: auto; padding: 10px 16px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Adicionar Totem
        </button>
      </div>

      <div id="totem-list"></div>
      
      <div id="totem-empty" style="display: none; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; color: var(--text-muted);">
        <div class="emoji" style="font-size: 64px; margin-bottom: 16px;">🎮</div>
        <p>Nenhum totem cadastrado. Adicione um totem para começar.</p>
      </div>
    </section>
  </main>

  <div id="toast"></div>

  <!-- ── Modal QR do Totem ──────────────────────────────────────────────── -->
  <div id="totemQrModal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="QR Code do Totem" style="display:none;">
    <div class="modal-content" style="max-width:360px;">
      <button class="modal-close" id="totemQrModalClose" aria-label="Fechar">&times;</button>
      <h2 style="margin-bottom:8px; font-size:18px; font-family:'Fira Code',monospace;">QR Code do Totem</h2>
      <p id="totem-qr-name" style="font-size:13px; color:var(--text-muted); margin-bottom:20px;"></p>
      <div style="width:240px; height:240px; background:white; padding:12px; border-radius:12px; margin:0 auto 20px;">
        <img id="totem-qr-img" style="width:100%; height:100%; object-fit:contain;" src="" alt="QR Code do Totem" />
      </div>
      <p style="font-size:11px; color:var(--text-muted); text-align:center; font-family:monospace; word-break:break-all;" id="totem-qr-url"></p>
    </div>
  </div>

  <!-- ── Modal de Fila do Totem ────────────────────────────────────────────── -->
  <div id="queueModal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Fila do Totem" style="display:none;">
    <div class="modal-content" style="max-width:420px;">
      <button class="modal-close" id="queueModalClose" aria-label="Fechar">&times;</button>
      <h2 style="margin-bottom:4px; font-size:18px; font-family:'Fira Code',monospace;">Fila do Totem</h2>
      <p id="queue-modal-totem-name" style="font-size:13px; color:var(--text-muted); margin-bottom:16px;"></p>
      <div id="queue-modal-body"></div>
    </div>
  </div>

  <!-- ── Modal de Cadastro de Totem ──────────────────────────────────────── -->
  <div id="totemFormModal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Novo Totem" style="display:none;">
    <div class="modal-content">
      <button class="modal-close" id="totemFormModalClose" aria-label="Fechar">&times;</button>

      <div class="modal-header">
        <h2 id="totem-form-title">Novo Totem</h2>
        <p>Configure o endereço de rede e as regras de sessão.</p>
      </div>

      <div class="modal-body">
        <div class="field-group">
          <label for="tf-name">Nome do Totem</label>
          <input id="tf-name" type="text" placeholder="ex: Cabine A" maxlength="80" />
        </div>

        <div class="field-row">
          <div class="field-group">
            <label for="tf-ip">Endereço IP</label>
            <input id="tf-ip" type="text" placeholder="192.168.1.10" maxlength="45" />
            <span class="field-hint">IP do servidor do jogo</span>
          </div>
          <div class="field-group">
            <label for="tf-port">Porta UDP</label>
            <input id="tf-port" type="number" min="1" max="65535" placeholder="9001" />
            <span class="field-hint">Padrão: 9001</span>
          </div>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label for="tf-max-players">Máx. Jogadores</label>
            <select id="tf-max-players">
              <option value="1">1 jogador</option>
              <option value="2" selected>2 jogadores</option>
              <option value="4">4 jogadores</option>
              <option value="8">8 jogadores</option>
            </select>
          </div>
          <div class="field-group">
            <label for="tf-duration">Duração da Sessão</label>
            <select id="tf-duration">
              <option value="300000">5 minutos</option>
              <option value="900000">15 minutos</option>
              <option value="1800000" selected>30 minutos</option>
              <option value="3600000">1 hora</option>
            </select>
          </div>
        </div>

        <div class="field-group">
          <label for="tf-max-queue">Tamanho Máx. da Fila</label>
          <input id="tf-max-queue" type="number" min="1" max="200" placeholder="Sem limite" />
          <span class="field-hint">Deixe em branco para fila ilimitada</span>
        </div>

        <div id="totem-error"></div>
      </div>

      <div class="modal-footer">
        <button id="btn-cancel-edit" class="btn btn-secondary" type="button" style="width:auto; padding: 9px 18px;">Cancelar</button>
        <button id="btn-save-totem" class="btn btn-primary" type="button" style="width:auto; padding: 9px 18px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          Salvar Totem
        </button>
      </div>
    </div>
  </div>

  <!-- SweetAlert2 (confirmation dialogs) -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>

  <script type="module" src="/dashboard.js"></script>

</body>
</html>
