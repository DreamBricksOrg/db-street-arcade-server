<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Street Arcade — Entrando…</title>
  <meta name="description" content="Conectando ao Street Arcade. Aguarde um momento." />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Fira+Sans:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #f8fafc;
      --surface: #ffffff;
      --border:  #e2e8f0;
      --accent:  #3b82f6;
      --accent2: #60a5fa;
      --text:    #0f172a;
      --muted:   #64748b;
      --success: #059669;
      --danger:  #dc2626;
    }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Fira Sans', sans-serif;
    }

    .screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; padding: 32px;
      text-align: center;
    }

    /* ── Logo ──────────────────────────────────────────────────────────────── */
    .logo-mark {
      width: 120px; height: 120px;
      display: flex; align-items: center; justify-content: center;
      animation: bounceIn 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .logo-mark img { width: 100%; height: 100%; object-fit: contain; }

    @keyframes bounceIn {
      from { opacity:0; transform:scale(0.5); }
      to   { opacity:1; transform:scale(1); }
    }

    /* ── Loading ───────────────────────────────────────────────────────────── */
    #loading { background: var(--bg); z-index: 10; }

    .loading-title {
      font-size: 24px; font-weight: 700;
      font-family: 'Fira Code', monospace;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .loading-sub { font-size: 14px; color: var(--muted); }

    .loader-bar {
      width: 180px; height: 3px;
      background: rgba(0,0,0,0.08);
      border-radius: 99px; overflow: hidden;
    }
    .loader-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      animation: loaderAnim 1.2s ease-in-out infinite;
    }
    @keyframes loaderAnim {
      0%   { width: 0%;  margin-left: 0%; }
      50%  { width: 60%; margin-left: 20%; }
      100% { width: 0%;  margin-left: 100%; }
    }

    /* ── Error ─────────────────────────────────────────────────────────────── */
    #error-screen { background: var(--bg); z-index: 10; display: none; }

    .error-icon  { font-size: 64px; }
    .error-title {
      font-size: 20px; font-weight: 700;
      font-family: 'Fira Code', monospace;
      color: var(--danger);
    }
    .error-msg {
      font-size: 14px; color: var(--muted);
      max-width: 280px; line-height: 1.6;
    }
    .retry-btn {
      margin-top: 8px;
      padding: 10px 24px;
      background: var(--accent);
      color: #fff;
      border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .retry-btn:hover { background: var(--accent2); }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loading" class="screen">
    <div class="logo-mark">
      <img src="/assets/images/dreambricks_logo_250x160.png" alt="DreamBricks Logo" />
    </div>
    <div>
      <div class="loading-title">Street Arcade</div>
      <div class="loading-sub" id="loading-sub">Conectando ao totem…</div>
    </div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>

  <!-- Error screen -->
  <div id="error-screen" class="screen">
    <div class="error-icon">⚠️</div>
    <div class="error-title">Totem Indisponível</div>
    <p class="error-msg" id="error-msg">Não foi possível conectar a este totem.</p>
    <button class="retry-btn" id="retry-btn">Tentar novamente</button>
  </div>

  <!-- Queue screen -->
  <div id="queue-screen" class="screen" style="display: none;">
    <div class="logo-mark">
      <img src="/assets/images/dreambricks_logo_250x160.png" alt="DreamBricks Logo" />
    </div>
    <div>
      <div class="loading-title">Fila de Espera</div>
      <div class="loading-sub" id="queue-sub" style="margin-top: 6px;">Sua vez está chegando...</div>
    </div>
    
    <div style="background: rgba(0,0,0,0.05); padding: 16px 24px; border-radius: 12px; margin-top: 10px;">
      <div style="font-size: 13px; font-weight: 600; text-transform: uppercase; color: var(--muted); margin-bottom: 8px;">Sua Posição</div>
      <div id="queue-pos" style="font-size: 48px; font-weight: 900; color: var(--accent); font-family: 'Fira Code', monospace; line-height: 1;">-</div>
    </div>

    <div class="loader-bar" style="margin-top: 10px;"><div class="loader-fill"></div></div>
    
    <p style="font-size: 12px; color: var(--muted); max-width: 280px; margin-top: 10px;">
      Seu lugar está garantido. Não feche esta tela ou você perderá a sua vaga.
    </p>
  </div>

  <script type="module" src="/totem-entry.js"></script>
</body>
</html>
