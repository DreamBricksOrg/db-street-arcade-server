# nginx server block for Brick Rush (TV display).
# Drop into your nginx's include path (e.g. /etc/nginx/sites-available/,
# then symlink into sites-enabled/, or conf.d/) and reload nginx.
# Assumes games/brick-rush/server.js (native or via
# games/brick-rush/docker-compose.yml) is reachable at 127.0.0.1:9100 on
# the same host as nginx.
# Note: UDP :9101 (backend → game packets) does NOT go through nginx —
# it's a raw UDP socket, unrelated to this HTTP reverse proxy.

upstream street_arcade_brick_rush {
  server 127.0.0.1:9100;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name brickrush.dbpe.com.br;

  # ── SSE: pacotes UDP repassados pro browser (GET /events) ─────────────────
  location /events {
    proxy_pass http://street_arcade_brick_rush;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    add_header X-Accel-Buffering no;
    proxy_read_timeout 1h;
  }

  # ── Static (TV) + /config + /queue-state + /end-session ───────────────────
  location / {
    proxy_pass http://street_arcade_brick_rush;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
