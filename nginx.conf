# nginx server block for the Street Arcade dashboard/API.
# Drop into your nginx's include path (e.g. /etc/nginx/sites-available/,
# then symlink into sites-enabled/, or conf.d/) and reload nginx.
# Assumes the Node app (npm run dev/start or the root docker-compose.yml)
# is reachable at 127.0.0.1:3000 on the same host as nginx.

upstream street_arcade_dashboard {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name streetarcade.dbpe.com.br;

  client_max_body_size 2m;

  # ── WebSocket: gamepad do jogador (/ws/game?sessionId=&playerId=) ─────────
  location /ws/game {
    proxy_pass http://street_arcade_dashboard;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket fica aberto por toda a sessão de jogo — sem timeout curto
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # ── SSE: push de mudanças na fila (GET /api/totems/:id/queue/events) ─────
  location ~ ^/api/totems/[^/]+/queue/events$ {
    proxy_pass http://street_arcade_dashboard;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    add_header X-Accel-Buffering no; # redundante com proxy_buffering off, mas explícito
    proxy_read_timeout 1h;
  }

  # ── REST API + painel do operador + páginas estáticas ─────────────────────
  location / {
    proxy_pass http://street_arcade_dashboard;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
