<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#f4f9fc">
  <title>Arcade Snake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1><img src="assets/dreambricks-mark-blue.svg" alt="" width="44" height="26" />Arcade Snake</h1>
    <p>Escaneie o QR Code com o celular para entrar.</p>
  </header>

  <main>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="sidePanel">
      <h2>Placar</h2>
      <ul id="scoreList"></ul>

      <h2 class="rank-heading">Ranking de hoje</h2>
      <ol id="rankList"></ol>

      <div id="debugPanel">
        <h2 class="debug-heading">Log de debug</h2>
        <div id="connStatus" class="conn-status conn-status--connecting">Conectando…</div>
        <div id="debugLog"></div>
      </div>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
