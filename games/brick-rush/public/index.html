<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b2530" />
  <title>🧱 Brick Rush — Street Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Frame only — the canvas's own rendering (render.js) is the game itself
       and is untouched. Background is the deep ink-blue step of the
       DreamBricks slate ramp (--db-slate-900), not an unrelated dark theme.
       A plain 1px DreamBricks Blue border, not a glow, ties the cabinet
       frame to the brand — a colored box-shadow glow on a dark bg is
       exactly the "gamer/cyberpunk" look PRODUCT.md rules out.
       See /DESIGN.md at the repo root and
       /design-system/dreambricks-manager/DreamBricks-Design-System for the
       shared token set. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: oklch(0.16 0.028 230); /* db-slate-900 */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
    }
    canvas {
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 1280 / 704;
      image-rendering: pixelated;
      border: 1px solid oklch(from #42b0d5 l c h / 0.3); /* DreamBricks Blue, faint */
      box-shadow: 0 0 60px oklch(0.16 0.028 230 / 0.8);
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="704"></canvas>
  <script type="module" src="/main.js"></script>
</body>
</html>
