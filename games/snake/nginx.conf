# nginx server block for the Snake game (TV display).
# Drop into your nginx's include path (e.g. /etc/nginx/sites-available/,
# then symlink into sites-enabled/, or conf.d/) and reload nginx.
# Assumes games/snake/server.js (native or via games/snake/docker-compose.yml)
# is reachable at 127.0.0.1:9000 on the same host as nginx.
# Note: UDP :9001 (backend → game packets) does NOT go through nginx —
# it's a raw UDP socket, unrelated to this HTTP reverse proxy.

upstream street_arcade_snake {
  server 127.0.0.1:9000;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name snake.dbpe.com.br;

  # ── SSE: pacotes UDP repassados pro browser (GET /events) ─────────────────
  location /events {
    proxy_pass http://street_arcade_snake;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    add_header X-Accel-Buffering no;
    proxy_read_timeout 1h;
  }

  # ── Static (TV) + /config + /queue-state + /end-session ───────────────────
  location / {
    proxy_pass http://street_arcade_snake;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
