<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Street Arcade — Painel Operador</title>
  <meta name="description" content="Painel do operador para gerenciar sessões do Street Arcade e exibir QR Codes." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Fira+Sans:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #f8fafc;
      --surface:    #ffffff;
      --surface2:   #f1f5f9;
      --border:     #e2e8f0;
      --accent:     #3b82f6;
      --accent2:    #60a5fa;
      --cta:        #f97316;
      --text:       #0f172a;
      --text-muted: #64748b;
      --success:    #10b981;
      --danger:     #ef4444;
      --radius:     8px;
      --glow:       0 4px 14px rgba(59, 130, 246, 0.4);
    }

    html, body { height: 100%; }

    body {
      font-family: 'Fira Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-icon {
      height: 48px;
      display: flex; align-items: center; justify-content: center;
    }
    
    .logo-icon img {
      max-height: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      font-family: 'Fira Code', monospace;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .badge-live {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--success);
      font-weight: 600;
    }

    .dot-pulse {
      width: 8px; height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    /* ── Main layout ─────────────────────────────────────────────────────── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 0;
    }

    /* ── Sidebar (create session) ─────────────────────────────────────────── */
    aside {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    aside h2 {
      font-size: 16px; font-weight: 700;
      font-family: 'Fira Code', monospace;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .field-group { display: flex; flex-direction: column; gap: 8px; }

    label {
      font-size: 13px; font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Fira Sans', sans-serif;
      font-size: 15px;
      padding: 12px 16px;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .totem-row {
      display: grid;
      grid-template-columns: 1fr 80px;
      gap: 8px;
    }

    .btn {
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      font-family: 'Fira Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.25);
    }

    .btn-primary:hover { transform: translateY(-2px); box-shadow: var(--glow); }
    .btn-primary:active{ transform: translateY(0); }

    .btn-primary:disabled {
      opacity: 0.4; cursor: not-allowed; transform: none;
    }

    /* ── Content area ────────────────────────────────────────────────────── */
    section.content {
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      overflow-y: auto;
    }

    /* ── QR Card ─────────────────────────────────────────────────────────── */
    #qr-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      max-width: 440px;
      margin: 0 auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1);
    }

    #qr-card.visible { display: flex; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .qr-label {
      font-size: 14px;
      font-weight: 700;
      font-family: 'Fira Code', monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
    }

    #qr-image {
      width: 260px; height: 260px;
      border-radius: 12px;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      padding: 12px;
      box-shadow: none;
    }

    #qr-image img { width: 100%; height: 100%; object-fit: contain; border-radius: 6px; }

    .qr-url {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      word-break: break-all;
      max-width: 300px;
    }

    .session-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .meta-pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .meta-pill span { color: var(--text); }

    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .status-waiting  { background: rgba(245, 158, 11, 0.12); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
    .status-active   { background: rgba(16, 185, 129, 0.12); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-finished { background: rgba(239, 68, 68, 0.12); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }

    /* ── Session list ────────────────────────────────────────────────────── */
    .sessions-header {
      display: flex; align-items: center; justify-content: space-between;
    }

    .sessions-header h2 {
      font-size: 20px; font-weight: 700;
      font-family: 'Fira Code', monospace;
    }

    #session-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .session-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex; flex-direction: column; gap: 12px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
    }

    .session-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .session-card-id {
      font-size: 13px;
      font-family: 'Fira Code', monospace;
      color: var(--text-muted);
    }

    .session-card-players {
      font-size: 14px;
      color: var(--text-muted);
    }

    .session-card-players strong { color: var(--text); }

    /* ── Empty state ─────────────────────────────────────────────────────── */
    #empty-state {
      display: flex; flex-direction: column; align-items: center;
      gap: 16px; padding: 80px 20px;
      color: var(--text-muted);
    }

    #empty-state .emoji { font-size: 64px; }
    #empty-state p { font-size: 16px; }

    /* ── Toast ───────────────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 14px; font-weight: 600;
      display: none;
      z-index: 999;
      animation: fadein 0.3s ease;
    }

    #toast.success { background: rgba(0,230,118,0.15); border: 1px solid var(--success); color: var(--success); }
    #toast.error   { background: rgba(255,82,82,0.15); border: 1px solid var(--danger);  color: var(--danger);  }

    @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }

    /* ── Spinner ─────────────────────────────────────────────────────────── */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid #000;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block; vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Modal ───────────────────────────────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center; justify-content: center;
      animation: fadeInModal 0.2s;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      width: 90%; max-width: 480px;
      position: relative;
      box-shadow: 0 16px 64px rgba(0,0,0,0.6);
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      background: transparent; border: none; font-size: 28px; line-height: 1; color: var(--text-muted);
      cursor: pointer; transition: color 0.2s;
    }
    .modal-close:hover { color: var(--text); }
    @keyframes fadeInModal { from { opacity: 0; } to { opacity: 1; } }

    /* ── Responsive ─────────────────────────────────────────────────────── */
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: none; border-bottom: 1px solid var(--border); }
      section.content { padding: 24px 16px; }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="/">
      <div class="logo-icon">
        <img src="/assets/images/dreambricks_logo_250x160.png" alt="DreamBricks Logo">
      </div>
      <span class="logo-text">Street Arcade</span>
    </a>
    <div class="badge-live">
      <div class="dot-pulse"></div>
      OPERADOR
    </div>
  </header>

  <main>
    <!-- ── Sidebar ──────────────────────────────────────────────────────── -->
    <aside>
      <h2>Nova Sessão</h2>

      <div class="field-group">
        <label for="max-players">Máx. Jogadores</label>
        <select id="max-players">
          <option value="1">1 jogador</option>
          <option value="2" selected>2 jogadores</option>
          <option value="4">4 jogadores</option>
        </select>
      </div>

      <div class="field-group">
        <label>Totem 1</label>
        <div class="totem-row">
          <input id="totem-ip" type="text" placeholder="192.168.1.100" value="127.0.0.1" />
          <input id="totem-port" type="text" placeholder="9001" value="9001" />
        </div>
      </div>

      <button id="btn-create" class="btn btn-primary" type="button">
        Criar Sessão + QR Code
      </button>
    </aside>

    <!-- ── Content ─────────────────────────────────────────────────────── -->
    <section class="content">

      <!-- QR Card — shown after session creation -->
      <div id="qr-card">
        <span class="qr-label">Escaneie para jogar</span>
        <div id="qr-image"><img id="qr-img" src="" alt="QR Code" /></div>
        <div id="session-status" class="status-badge status-waiting">
          <div class="dot-pulse"></div>
          Aguardando
        </div>
        <div class="session-meta">
          <div class="meta-pill">ID: <span id="meta-sid">—</span></div>
          <div class="meta-pill">Expira: <span id="meta-exp">—</span></div>
        </div>
        <p class="qr-url" id="qr-url-text">—</p>
      </div>

      <!-- Session list -->
      <div class="sessions-header">
        <h2>Sessões Ativas</h2>
      </div>

      <div id="session-list"></div>
      <div id="empty-state">
        <div class="emoji">🎮</div>
        <p>Nenhuma sessão ativa. Crie uma para começar.</p>
      </div>
    </section>
  </main>

  <div id="toast"></div>

  <!-- ── Modal de Detalhes da Sessão ───────────────────────────────────── -->
  <div id="sessionModal" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">&times;</button>
      <h2 style="margin-bottom: 24px; font-size: 20px; font-family: 'Fira Code', monospace;">Detalhes da Sessão</h2>
      
      <div id="modal-qr-image" style="width: 260px; height: 260px; background: white; padding: 12px; border-radius: 12px; margin: 0 auto 24px;">
        <img id="modal-qr-img" style="width: 100%; height: 100%; object-fit: contain; border-radius: 6px;" src="" alt="QR Code Expandido" />
      </div>
      
      <div class="session-meta" style="margin-bottom: 24px;">
        <div class="meta-pill">ID: <span id="modal-meta-sid">—</span></div>
        <div class="meta-pill">Status: <span id="modal-meta-status" style="text-transform: capitalize;">—</span></div>
      </div>
      
      <div id="modal-details" style="text-align: left; background: var(--surface2); border: 1px solid var(--border); padding: 20px; border-radius: 8px; width: 100%; margin-bottom: 24px; max-height: 280px; overflow-y: auto; font-size: 14px; color: var(--text);">
      </div>
      
      <button id="modal-btn-play" class="btn btn-primary" style="width: 100%;">Abrir Gamepad Mobile</button>
    </div>
  </div>

  <script type="module" src="/qrcode-page.js"></script>
</body>
</html>
