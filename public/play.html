<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Street Arcade</title>
  <meta name="description" content="Controle do Street Arcade. Escaneie o QR Code para jogar." />
  <meta name="theme-color" content="#0a0a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Fira+Sans:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f8fafc;
      --surface:  #ffffff;
      --surface2: #f1f5f9;
      --border:   #e2e8f0;
      --accent:   #3b82f6;
      --accent2:  #60a5fa;
      --text:     #0f172a;
      --muted:    #64748b;
      --success:  #059669;
      --danger:   #dc2626;

      /* Gamepad button colours */
      --btn-A: #10b981;
      --btn-B: #ef4444;
      --btn-X: #06b6d4;
      --btn-Y: #f59e0b;
      --dpad:  #e2e8f0;
    }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Fira Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* touch-action:none is scoped to the gamepad itself, not the whole page,
       so pinch-zoom (WCAG 1.4.4) still works everywhere else on this screen. */
    #gamepad {
      touch-action: none;
    }

    /* ── Utility screens ─────────────────────────────────────────────────── */
    .screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; padding: 32px;
      text-align: center;
    }

    /* Loading */
    #loading {
      background: var(--bg);
      z-index: 10;
    }

    .logo-mark {
      width: 140px; height: 140px;
      display: flex; align-items: center; justify-content: center;
      animation: bounceIn 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .logo-mark img { width: 100%; height: 100%; object-fit: contain; }

    @keyframes bounceIn {
      from { opacity:0; transform:scale(0.5); }
      to   { opacity:1; transform:scale(1); }
    }

    .loading-title {
      font-size: 26px; font-weight: 700;
      font-family: 'Fira Code', monospace;
      color: var(--accent);
    }

    .loading-sub { font-size: 15px; color: var(--muted); }

    .loader-bar {
      width: 180px; height: 3px;
      background: rgba(0,0,0,0.08);
      border-radius: 99px; overflow: hidden;
    }

    .loader-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      animation: loaderAnim 1.2s ease-in-out infinite;
    }

    @keyframes loaderAnim {
      0%   { width: 0%; margin-left: 0%; }
      50%  { width: 60%; margin-left: 20%; }
      100% { width: 0%; margin-left: 100%; }
    }

    /* Error */
    #error-screen {
      background: var(--bg); z-index: 10; display: none;
    }

    .error-icon { font-size: 64px; }
    .error-title { font-size: 22px; font-weight: 700; font-family: 'Fira Code', monospace; color: var(--danger); }
    .error-msg { font-size: 15px; font-family: 'Fira Sans', sans-serif; color: var(--muted); max-width: 280px; line-height: 1.5; }

    /* ── Play screen ─────────────────────────────────────────────────────── */
    #play-screen {
      position: fixed; inset: 0;
      display: none;
      flex-direction: column;
    }

    /* Status bar */
    .play-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .play-title {
      font-size: 16px; font-weight: 700;
      font-family: 'Fira Code', monospace;
      color: var(--accent);
    }

    .header-center {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--muted);
    }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted);
      transition: background 0.4s, box-shadow 0.4s;
    }

    .status-dot.connected {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .status-dot.error { background: var(--danger); }

    #conn-status-text { font-size: 11px; color: var(--muted); }

    #sid-label { font-size: 10px; font-family: monospace; color: var(--muted); opacity: 0.6; }

    /* ── Gamepad area ────────────────────────────────────────────────────── */
    #gamepad {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: clamp(24px, 8vw, 64px);
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      min-height: 0;        /* prevents flex overflow */
    }

    /* ── D-Pad ───────────────────────────────────────────────────────────── */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
      width: min(42vw, 180px);
      aspect-ratio: 1;
      flex-shrink: 0;
    }

    .dpad-btn {
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
      font: inherit;
      color: inherit;
      background: var(--dpad);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(14px, 4vw, 22px);
      cursor: pointer;
      transition: background 0.08s, transform 0.08s;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    .dpad-btn.pressed {
      background: var(--surface2);
      transform: scale(0.9);
      border-color: var(--accent);
      box-shadow: var(--glow);
    }

    .dpad-btn:focus-visible,
    .face-btn:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    /* Hide center cell */
    .dpad-center {
      background: transparent;
      border: none;
      pointer-events: none;
    }

    /* ── Face buttons — Cruz estilo Xbox ───────────────────────────────────
       Grid 3×3; cantos vazios formam a cruz:
             [ ]  [Y]  [ ]
             [X]  [ ]  [B]
             [ ]  [A]  [ ]
    ─────────────────────────────────────────────────────────────────────── */
    .face-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      width: min(44vw, 186px);
      aspect-ratio: 1;
      flex-shrink: 0;
    }

    /* Empty corner cells */
    .face-empty {
      background: transparent;
      pointer-events: none;
    }

    .face-btn {
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
      font: inherit;
      border-radius: 50%;
      border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(15px, 4.5vw, 22px);
      font-weight: 700;
      font-family: 'Fira Code', monospace;
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.08s, filter 0.08s;
      -webkit-tap-highlight-color: transparent;
      aspect-ratio: 1;
      position: relative;
      box-shadow: 0 5px 0 rgba(0,0,0,0.15);
      letter-spacing: 0;
    }

    .face-btn.pressed {
      transform: scale(0.87) translateY(3px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.15);
      filter: brightness(1.35);
    }

    /* Xbox colour palette */
    #btn-A { background: #107c10; color: #fff; }   /* Xbox green  — bottom */
    #btn-B { background: #e23c28; color: #fff; }   /* Xbox red    — right  */
    #btn-X { background: #0078d4; color: #fff; }   /* Xbox blue   — left   */
    #btn-Y { background: #ffb900; color: #000; }   /* Xbox yellow — top    */

    /* ── Input log (debug, hidden by default) ──────────────────────────── */
    #input-log {
      position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.8);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 11px; font-family: monospace; color: var(--muted);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
      white-space: nowrap;
      z-index: 5;
    }

    #input-log.show { opacity: 1; }

    /* ── Safe area (notch support) ──────────────────────────────────────── */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      #gamepad {
        padding-bottom: calc(16px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loading" class="screen">
    <div class="logo-mark">
      <img src="/assets/images/dreambricks_logo_250x160.png" alt="DreamBricks Logo" />
    </div>
    <div>
      <div class="loading-title">Street Arcade</div>
      <div class="loading-sub">Conectando à sessão…</div>
    </div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>

  <!-- Error screen -->
  <div id="error-screen" class="screen">
    <div class="error-icon">⚠️</div>
    <div class="error-title">Sessão Inválida</div>
    <p class="error-msg" id="error-msg">Não foi possível conectar à sessão.</p>
  </div>

  <!-- Play screen (G8.1 — D-Pad + ABXY + status) -->
  <div id="play-screen">

    <!-- Status header -->
    <div class="play-header">
      <span class="play-title">🕹️ Arcade</span>
      <div class="header-center">
        <div id="conn-dot" class="status-dot"></div>
        <span id="conn-status-text">Conectando…</span>
      </div>
      <span id="sid-label">—</span>
    </div>

    <!-- Gamepad (G8.1) -->
    <div id="gamepad">

      <!-- D-Pad (left side). Keyboard: arrow keys (global) or Tab+Space/Enter per button. -->
      <div class="dpad">
        <!-- Row 1 -->
        <div></div>
        <button type="button" id="btn-up" class="dpad-btn" data-btn aria-label="Cima (seta ↑)">▲</button>
        <div></div>
        <!-- Row 2 -->
        <button type="button" id="btn-left"  class="dpad-btn" data-btn aria-label="Esquerda (seta ←)">◀</button>
        <div class="dpad-center"></div>
        <button type="button" id="btn-right" class="dpad-btn" data-btn aria-label="Direita (seta →)">▶</button>
        <!-- Row 3 -->
        <div></div>
        <button type="button" id="btn-down" class="dpad-btn" data-btn aria-label="Baixo (seta ↓)">▼</button>
        <div></div>
      </div>

      <!-- Face buttons — Cruz Xbox: Y(topo) X(esq) B(dir) A(baixo). Keyboard: I/J/K/L (global) or Tab+Space/Enter. -->
      <div class="face-buttons">
        <!-- Row 1: _ Y _ -->
        <div class="face-empty"></div>
        <button type="button" id="btn-Y" class="face-btn" data-btn aria-label="Y (tecla I)">Y</button>
        <div class="face-empty"></div>
        <!-- Row 2: X _ B -->
        <button type="button" id="btn-X" class="face-btn" data-btn aria-label="X (tecla J)">X</button>
        <div class="face-empty"></div>
        <button type="button" id="btn-B" class="face-btn" data-btn aria-label="B (tecla L)">B</button>
        <!-- Row 3: _ A _ -->
        <div class="face-empty"></div>
        <button type="button" id="btn-A" class="face-btn" data-btn aria-label="A (tecla K)">A</button>
        <div class="face-empty"></div>
      </div>

    </div><!-- #gamepad -->

    <!-- Input debug log -->
    <div id="input-log"></div>
  </div>

  <!-- C9.2 + C9.3: session orchestrator (reads URL, connects WS, wires gamepad) -->
  <script type="module" src="/session.js"></script>
</body>
</html>
