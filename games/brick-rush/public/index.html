<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧱 Brick Rush — Street Arcade</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0b0d14;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }
    canvas {
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 1280 / 704;
      image-rendering: pixelated;
      box-shadow: 0 0 60px rgba(0,0,0,0.8);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="704"></canvas>
  <script type="module" src="/main.js"></script>
</body>
</html>
