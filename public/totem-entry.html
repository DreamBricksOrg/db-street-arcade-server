<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Street Arcade — Entrando…</title>
  <meta name="description" content="Conectando ao Street Arcade. Aguarde um momento." />
  <meta name="theme-color" content="#f3f7f9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="/assets/brand/dreambricks-mark-blue.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--surface-page);
      color: var(--text-primary);
      font-family: var(--font-body);
    }

    #loading, #error-screen { z-index: 10; }

    /* ── Queue: the position number is the whole point of this screen ──────── */
    .queue-place {
      display: flex; flex-direction: column; align-items: center; gap: var(--space-2);
      padding: var(--space-6) 0 var(--space-4);
    }
    .queue-place__label {
      font-size: var(--text-sm); color: var(--text-secondary);
    }
    .queue-place__num {
      font: var(--weight-bold) clamp(72px, 26vw, 120px)/0.9 var(--font-mono);
      letter-spacing: -0.04em;
      color: var(--surface-brand-strong);
      font-variant-numeric: tabular-nums;
    }
    .queue-place__num.is-bump { animation: bump 0.45s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes bump { from { transform: scale(1.18); color: var(--surface-brand); } }
    .queue-place__eta {
      min-height: 1.4em;
      font: var(--weight-medium) var(--text-sm)/1.4 var(--font-mono);
      color: var(--text-brand);
    }
    .queue-note {
      max-width: 30ch;
      font-size: var(--text-xs); line-height: 1.5; color: var(--text-secondary);
    }

    @media (prefers-reduced-motion: reduce) {
      .queue-place__num.is-bump { animation: none; }
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <main id="loading" class="sa-screen" aria-live="polite">
    <div class="sa-mark"><img src="/assets/brand/dreambricks-mark-blue.svg" alt="DreamBricks" /></div>
    <div>
      <h1 class="sa-title sa-title--brand">Street Arcade</h1>
      <p class="sa-sub" id="loading-sub">Conectando ao totem…</p>
    </div>
    <div class="sa-loader" role="progressbar" aria-label="Carregando"></div>
  </main>

  <!-- Error -->
  <main id="error-screen" class="sa-screen" style="display: none;" aria-live="assertive">
    <img class="sa-mascot" src="/assets/brand/jobson-wave.webp" alt="" width="320" height="322" />
    <div>
      <h1 class="sa-title">Não deu para entrar</h1>
      <p class="sa-sub" id="error-msg">Não foi possível conectar a este totem.</p>
    </div>
    <div class="sa-actions">
      <button class="db-btn db-btn--primary db-btn--lg db-btn--block" id="retry-btn" type="button">Tentar novamente</button>
    </div>
  </main>

  <!-- Queue -->
  <main id="queue-screen" class="sa-screen" style="display: none;">
    <div class="sa-mark" style="width: 72px;"><img src="/assets/brand/dreambricks-mark-blue.svg" alt="DreamBricks" /></div>
    <div>
      <h1 class="sa-title">Você está na fila</h1>
      <p class="sa-sub" id="queue-sub">Quando chegar a sua vez, o controle abre sozinho.</p>
    </div>

    <div class="queue-place" aria-live="polite">
      <span class="queue-place__label">Sua posição</span>
      <span class="queue-place__num" id="queue-pos">–</span>
      <span class="queue-place__eta" id="queue-eta"></span>
    </div>

    <div class="sa-loader" role="progressbar" aria-label="Aguardando a sua vez"></div>
    <p class="queue-note">Se sair desta tela, volte pelo mesmo QR em até 2 minutos para não perder o lugar.</p>
  </main>

  <script type="module" src="/totem-entry.js"></script>
</body>
</html>
